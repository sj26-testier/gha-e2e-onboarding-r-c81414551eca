name: Delete null-on
on: workflow_dispatch
permissions: {}
jobs:
  marker:
    name: Delete null-on marker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Execute default branch evidence
        env:
          DELETE_CONTEXT: '{"event_name": "${{ github.event_name }}", "action": "${{ github.event.action }}", "ref": "${{ github.ref }}", "ref_name": "${{ github.ref_name }}", "ref_type": "${{ github.ref_type }}", "sha": "${{ github.sha }}", "workflow": "${{ github.workflow }}", "workflow_ref": "${{ github.workflow_ref }}", "workflow_sha": "${{ github.workflow_sha }}", "repository": "${{ github.repository }}", "deleted_ref": "${{ github.event.ref }}", "deleted_type": "${{ github.event.ref_type }}"}'
          DELETE_WORKFLOW_MARKER: "r-c81414551eca:DEFAULT-CONTENT-B:null-on"
        run: python3 delete-marker.py
